name: Deploy production website

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deployment
  cancel-in-progress: true

jobs:
  deploy:
    name: Trigger Vercel production deployment
    runs-on: ubuntu-latest
    steps:
      - name: Trigger protected Vercel deploy hook
        env:
          VERCEL_DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          if [ -z "$VERCEL_DEPLOY_HOOK" ]; then
            echo "VERCEL_DEPLOY_HOOK repository secret is not configured."
            exit 1
          fi

          curl --fail --show-error --silent \
            --request POST \
            "$VERCEL_DEPLOY_HOOK"
